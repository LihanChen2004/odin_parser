[project]
name = "odin-parser"
version = "0.0.1"
description = "Parser for ManifoldTech Odin1 private binary datasets -> PandaSet-style output for gsplat"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
odin-parser = "odin_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
